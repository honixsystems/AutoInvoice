[package]
name = "autoinvoice"
version = "1.5.0"
description = "Invoicing tool"
authors = [ "Gwenaël HUBLER" ]
license = "MIT"
repository = "https://github.com/honixsystems/AutoInvoice"
edition = "2021"

[lib]
name = "autoinvoice_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies.tauri-build]
version = "2.0.5"
features = [ ]

[dependencies]
tauri-plugin-shell = "2.2.0"
tauri-plugin-notification = "2"
tauri-plugin-os = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-store = "2.2.0"
tauri-plugin-dialog = "2.2.0"
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
typst-as-lib = { version = "0.14.1", features = ["packages", "reqwest"] }
typst = "0.13.0"
derive_typst_intoval = "0.3.0"
typst-pdf = "0.13.0"
typst-library = "0.13.0"
tauri-plugin-opener = "2"
mac_address = "1.1.8"
tauri-plugin-http = "2"

[dependencies.tauri]
version = "2.2.5"
features = [ "macos-private-api",
  "tray-icon",
  "unstable"]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
