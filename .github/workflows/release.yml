name: release

on:
  push:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: macos-arm64
          #- platform: macos-latest
          #  args: --target x86_64-apple-darwin
          #  artifact: macos-x64
          #- platform: ubuntu-22.04
          #  args: ""
          #  artifact: linux
          #- platform: windows-latest
          #  args: ""
          #  artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Install frontend deps
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: autoinvoice-v__VERSION__
          releaseName: AutoInvoice v__VERSION__
          releaseBody: After installing the Apple app you have to run "xattr -c /Applications/AutoInvoice.app" once before launching
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
  
  upload-to-azure:
    name: Upload to Azure Blob
    runs-on: ubuntu-latest
    needs: build-tauri

    steps:
      - name: List available artifacts
        run: |
          echo "Available artifacts:"
          ls -la
          echo "Contents of current directory:"
          pwd

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '**/*'

      - name: Verify downloaded artifacts
        run: |
          echo "Contents of artifacts directory:"
          ls -la artifacts || echo "Artifacts directory is empty or does not exist"

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Upload updater files to Azure
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          find artifacts -name "*.zip" -exec echo "Found:" {} \;
          find artifacts -name "latest.json" -exec echo "Found:" {} \;

          for file in $(find artifacts -name "*.zip" -o -name "latest.json"); do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --account-key "$AZURE_STORAGE_KEY" \
              --container-name releases \
              --name releases/$filename \
              --file "$file" \
              --overwrite
          done
          