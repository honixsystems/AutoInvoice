name: release

on:
  push:
    branches:
      - main

jobs:
  build-tauri:
    outputs:
      releaseId: ${{ steps.tauri.outputs.releaseId }}
      appVersion: ${{ steps.tauri.outputs.appVersion }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: macos-arm64
          #- platform: macos-latest
          #  args: --target x86_64-apple-darwin
          #  artifact: macos-x64
          #- platform: ubuntu-22.04
          #  args: ""
          #  artifact: linux
          #- platform: windows-latest
          #  args: ""
          #  artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Install frontend deps
        run: pnpm install

      - name: Build and release Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: autoinvoice-v__VERSION__
          releaseName: AutoInvoice v__VERSION__
          releaseBody: After installing the Apple app you have to run "xattr -c /Applications/AutoInvoice.app" once before launching
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          includeDebug: true
          args: ${{ matrix.args }}
  
  upload-to-azure:
    name: Upload to Azure Blob
    runs-on: ubuntu-latest
    needs: build-tauri

    steps:
      - name: Log the release id
        run: |
          echo "Release ID: ${{ needs.build-tauri.outputs.releaseId }}"

      - name: Download from the release
        uses: robinraju/release-downloader@v1.12
        with:
          latest: true
          fileName: '*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Upload to Azure Blob Storage
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          # Upload all downloaded files without latest.json to Azure Blob Storage
          for file in $(find ./AutoInvoice -type f ! -name "latest.json"); do
            filename=$(basename "$file")
            echo "Uploading $filename to Azure Blob Storage..."
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --account-key "$AZURE_STORAGE_KEY" \
              --container-name autoinvoice-releases \
              --name "autoinvoice-releases/autoinvoice-${{ needs.build-tauri.outputs.appVersion }}/$filename" \
              --file "$file" \
              --overwrite
          done

      - name: Sed latest.json to replace the GitHub release URL with the Azure Blob Storage URL
        run: |
          export VERSION=${{ needs.build-tauri.outputs.appVersion }}
          sed -i 's|https://github.com/honixsystems/AutoInvoice/releases/download/autoinvoice-${{ needs.build-tauri.outputs.appVersion }}|https://autohubs3.blob.core.windows.net/autoinvoice-releases/autoinvoice-${{ needs.build-tauri.outputs.appVersion }}|' latest.json


      - name: Upload latest.json to Azure Blob Storage
        run: |
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name autoinvoice-releases \
            --name "autoinvoice-releases/latest.json" \
            --file "./AutoInvoice/latest.json" \
            --overwrite
