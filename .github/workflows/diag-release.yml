name: diag-release
# Diagnostic temporaire : teste si le GITHUB_TOKEN peut créer releases et tags. Sera supprimé.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API: https://api.github.com/repos/${{ github.repository }}
    steps:
      - name: Try creating releases and tags with GITHUB_TOKEN
        run: |
          H=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          try() {
            echo "=== $1"
            curl -sS -o body.json -D headers.txt -X POST "$API/releases" "${H[@]}" -d "$2"
            head -1 headers.txt; grep -i -E "x-accepted-github-permissions" headers.txt || true
            jq -c '{message, errors, id, tag_name, draft}' body.json
            id=$(jq -r '.id // empty' body.json)
            if [ -n "$id" ]; then
              curl -sS -X DELETE "$API/releases/$id" "${H[@]}" -o /dev/null -w "deleted release: %{http_code}\n"
              if [ "$(jq -r .draft body.json)" = "false" ]; then
                curl -sS -X DELETE "$API/git/refs/tags/$(jq -r .tag_name body.json)" "${H[@]}" -o /dev/null -w "deleted tag: %{http_code}\n"
              fi
            fi
          }
          try "draft on HEAD" '{"tag_name":"diag-draft","draft":true,"target_commitish":"${{ github.sha }}"}'
          try "published on HEAD (touches workflows)" '{"tag_name":"diag-head","prerelease":true,"target_commitish":"${{ github.sha }}"}'
          try "published on 32a2744 (no workflow change)" '{"tag_name":"diag-old","prerelease":true,"target_commitish":"32a2744fed1f6b861eebcf16ffed0dd9bf33bba4"}'
          echo "=== create tag ref directly on 32a2744"
          curl -sS -o ref.json -D headers.txt -X POST "$API/git/refs" "${H[@]}" -d '{"ref":"refs/tags/diag-ref","sha":"32a2744fed1f6b861eebcf16ffed0dd9bf33bba4"}'
          head -1 headers.txt; grep -i -E "x-accepted-github-permissions" headers.txt || true; jq -c '{message, ref}' ref.json
          curl -sS -X DELETE "$API/git/refs/tags/diag-ref" "${H[@]}" -o /dev/null -w "deleted ref: %{http_code}\n"
